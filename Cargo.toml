[package]
name = "tensor_lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "tensor_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
num-traits = "0.2"
smallvec = "1.16.4"
pyo3 = {  version = "0.30.1", features = ["extension-module"], optional = true }

[features]
python-testing = ["dep:pyo3"]