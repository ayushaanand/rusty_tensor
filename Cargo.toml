[package]
name = "tensor_lib"
version = "0.1.0"
edition = "2024"

[lib]
name = "tensor_lib"
crate-type = ["rlib", "cdylib"]

[dependencies]
num-traits = "0.2"
smallvec = "1.15.2"
itertools = "0.15.0"
pyo3 = {  version = "0.29.0", features = ["extension-module"], optional = true }

[features]
python-testing = ["dep:pyo3"]